[package]
name = "xylok-view"
version = "0.8.0"
edition = "2024"
description = "A fast, cross-platform desktop viewer for DISA Security Technical Implementation Guides (STIGs)"
license = "MIT"
repository = "https://github.com/joshuardecker/xylok-view"

[[bin]]
name = "xylok-view"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", features = ["svg", "image", "lazy", "advanced"] }
iced_graphics = "0.14.0"
cosmic-text = "0.15.0"
unicode-segmentation = "1.0.0"
pulldown-cmark = "0.12"
image = "0.25.9"
regex = "1.12.2"
rfd = "0.17.2"
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.6"
ureq = "3.3.0"
serde_json = "1.0.149"
open = "5.3.4"
zstd = "0.13.3"
disa-stig = { path = "disa-stig" }
thiserror = "2.0.18"

[workspace]
members = ["disa-stig"]
resolver = "3"

[build-dependencies]
winresource = "0.1.20"

[package.metadata.deb]
maintainer = "Joshua Decker <joshuardecker@pm.me>"
# Hard deps: libraries the binary cannot run without (always dlopen'd, no fallback).
depends = "libvulkan1, libegl1, libxkbcommon0, libdbus-1-3"
# Recommended: platform-specific libs. The binary dlopens Wayland and X11 with
# fallback between them, so neither set is strictly required. apt installs
# Recommends by default; users on a single-platform system may prune the other.
recommends = "libwayland-client0, libwayland-egl1, libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6, libxkbcommon-x11-0"
section = "utils"
priority = "optional"
license-file = ["LICENSE"]
extended-description = """\
Xylok View is a fast, cross-platform desktop viewer for DISA Security Technical \
Implementation Guides (STIGs). It supports XCCDF, CKL, CKLB, and Xylok packed \
TOML benchmark formats, and is built with a native Rust UI using the Iced \
framework.\
"""
assets = [
    ["target/release/xylok-view", "/usr/bin/", "755"],
    ["assets/io.github.joshuardecker.xylok-view.desktop", "/usr/share/applications/", "644"],
    ["assets/logo/logo-16.png", "/usr/share/icons/hicolor/16x16/apps/io.github.joshuardecker.xylok-view.png", "644"],
    ["assets/logo/logo-32.png", "/usr/share/icons/hicolor/32x32/apps/io.github.joshuardecker.xylok-view.png", "644"],
    ["assets/logo/logo-48.png", "/usr/share/icons/hicolor/48x48/apps/io.github.joshuardecker.xylok-view.png", "644"],
    ["assets/logo/logo-64.png", "/usr/share/icons/hicolor/64x64/apps/io.github.joshuardecker.xylok-view.png", "644"],
    ["assets/logo/logo-128.png", "/usr/share/icons/hicolor/128x128/apps/io.github.joshuardecker.xylok-view.png", "644"],
    ["assets/logo/logo-256.png", "/usr/share/icons/hicolor/256x256/apps/io.github.joshuardecker.xylok-view.png", "644"],
    ["assets/logo/logo-512.png", "/usr/share/icons/hicolor/512x512/apps/io.github.joshuardecker.xylok-view.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/xylok-view", dest = "/usr/bin/xylok-view", mode = "755" },
    { source = "assets/io.github.joshuardecker.xylok-view.desktop", dest = "/usr/share/applications/io.github.joshuardecker.xylok-view.desktop", mode = "644" },
    { source = "assets/logo/logo-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/io.github.joshuardecker.xylok-view.png", mode = "644" },
    { source = "assets/logo/logo-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/io.github.joshuardecker.xylok-view.png", mode = "644" },
    { source = "assets/logo/logo-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.github.joshuardecker.xylok-view.png", mode = "644" },
    { source = "assets/logo/logo-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/io.github.joshuardecker.xylok-view.png", mode = "644" },
    { source = "assets/logo/logo-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github.joshuardecker.xylok-view.png", mode = "644" },
    { source = "assets/logo/logo-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.joshuardecker.xylok-view.png", mode = "644" },
    { source = "assets/logo/logo-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github.joshuardecker.xylok-view.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
# Hard deps: libraries the binary cannot run without (always dlopen'd, no fallback).
vulkan-loader = "*"
mesa-libEGL = "*"
libxkbcommon = "*"
dbus-libs = "*"

[package.metadata.generate-rpm.recommends]
# Recommended: platform-specific libs. The binary dlopens Wayland and X11 with
# fallback between them, so neither set is strictly required. dnf installs
# Recommends by default; users on a single-platform system may prune the other.
wayland = "*"
mesa-libwayland-egl = "*"
libX11 = "*"
libX11-xcb = "*"
libxcb = "*"
libXcursor = "*"
libXi = "*"
libxkbcommon-x11 = "*"
