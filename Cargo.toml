[package]
name = "xylok-view"
version = "0.8.0"
edition = "2024"

[[bin]]
name = "xylok-view"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", features = ["svg", "image", "lazy", "advanced"] }
iced_graphics = "0.14.0"
cosmic-text = "0.15.0"
unicode-segmentation = "1.0.0"
pulldown-cmark = "0.12"
image = "0.25.9"
regex = "1.12.2"
rfd = "0.17.2"
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.6"
ureq = "3.3.0"
serde_json = "1.0.149"
open = "5.3.4"
zstd = "0.13.3"
disa-stig = { path = "disa-stig" }
thiserror = "2.0.18"

[workspace]
members = ["disa-stig"]
resolver = "3"

[build-dependencies]
winresource = "0.1.20"
